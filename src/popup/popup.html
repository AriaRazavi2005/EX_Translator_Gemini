<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دستیار هوشمند Gemini</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand"><span class="sparkle">✦</span><span>دستیار Gemini</span></div>
      <nav class="header-nav" aria-label="ناوبری">
        <button id="tab-translate-btn" class="nav-tab active">پردازش</button>
        <button id="tab-history-btn" class="nav-tab">تاریخچه</button>
        <button id="open-options-btn" class="icon-btn" title="تنظیمات" aria-label="تنظیمات">⚙️</button>
      </nav>
    </header>

    <main id="translate-view" class="view-content">
      <div class="card mode-card">
        <label for="mode-select">عملکرد هوش مصنوعی</label>
        <select id="mode-select" class="mode-select"></select>
      </div>

      <div class="card input-card">
        <div class="card-header language-row">
          <select id="source-lang" class="lang-select" aria-label="زبان مبدأ"></select>
          <button id="swap-langs-btn" class="swap-btn" title="جابه‌جایی زبان‌ها" aria-label="جابه‌جایی زبان‌ها">⇄</button>
          <select id="target-lang" class="lang-select" aria-label="زبان مقصد"></select>
        </div>

        <div class="textarea-wrapper">
          <textarea id="source-text" dir="auto" placeholder="متن خود را اینجا بنویسید یا جای‌گذاری کنید..." rows="4"></textarea>
          <button id="clear-text-btn" class="clear-btn" title="پاک کردن" aria-label="پاک کردن">&times;</button>
        </div>

        <div class="card-footer">
          <div class="tone-picker" id="tone-wrapper">
            <label for="tone-select">لحن:</label>
            <select id="tone-select">
              <option value="general">عمومی</option>
              <option value="formal">رسمی</option>
              <option value="informal">صمیمانه</option>
              <option value="technical">تخصصی</option>
            </select>
          </div>
          <span id="char-count" class="char-count">0</span>
        </div>
      </div>

      <button id="translate-submit-btn" class="primary-btn">
        <span class="btn-label">✦ اجرا</span><span class="btn-hint">Ctrl + Enter</span>
      </button>

      <div class="card output-card">
        <div class="card-header output-header">
          <span class="output-title" id="output-title">نتیجه</span>
          <span id="cache-badge" class="cache-badge" title="این نتیجه از حافظه محلی خوانده شد">⚡ از حافظه</span>
          <div class="output-actions">
            <button id="stop-btn" class="icon-btn stop-btn" title="توقف" aria-label="توقف">■</button>
            <button id="tts-result-btn" class="icon-btn" title="پخش صوتی" aria-label="پخش صوتی">🔊</button>
            <button id="copy-result-btn" class="icon-btn" title="کپی" aria-label="کپی">📋</button>
          </div>
        </div>
        <div id="output-text" class="output-content placeholder-text" dir="auto">نتیجه زنده اینجا نمایش داده می‌شود...</div>
      </div>
    </main>

    <section id="history-view" class="view-content" style="display: none;">
      <div class="history-header">
        <span>📜 تاریخچه</span>
        <button id="clear-history-btn" class="danger-btn">پاک کردن همه</button>
      </div>
      <div class="history-filters">
        <input id="history-search" type="search" placeholder="جست‌وجو در متن و نتیجه..." />
        <select id="history-mode-filter"><option value="">همه عملکردها</option></select>
      </div>
      <div id="history-list" class="history-list"></div>
      <div class="history-footer" id="history-count"></div>
    </section>

    <footer class="app-footer">
      <span id="active-model-badge" class="model-badge">…</span>
      <span id="status-msg" class="status-msg"></span>
    </footer>
  </div>

  <script src="../shared/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
