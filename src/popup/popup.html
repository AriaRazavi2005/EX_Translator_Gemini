<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>دستیار هوشمند Gemini</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="sparkle">✦</span>
        <span>دستیار Gemini</span>
      </div>
      <nav class="header-nav">
        <button id="tab-translate-btn" class="nav-tab active">پردازش</button>
        <button id="tab-history-btn" class="nav-tab">تاریخچه</button>
        <button id="open-options-btn" class="icon-btn" title="تنطیمات">⚙️</button>
      </nav>
    </header>

    <!-- ==================== Translate view ==================== -->
    <main id="translate-view" class="view-content">
      <div class="card mode-card">
        <label for="mode-select">عملکرد هوش مصنوعی</label>
        <select id="mode-select" class="mode-select"></select>
      </div>

      <div class="card">
        <div class="card-header">
          <select id="source-lang" class="lang-select"></select>
          <button id="swap-langs-btn" class="swap-btn" title="جابجایی زبان‌ها">⇄</button>
          <select id="target-lang" class="lang-select"></select>
        </div>

        <div class="textarea-wrapper">
          <textarea id="source-text" placeholder="متن خود را اینجا بنویسید یا پیست کنید..." rows="4"></textarea>
          <button id="clear-text-btn" class="clear-btn" title="پاک کردن">&times;</button>
        </div>

        <div class="card-footer">
          <div class="tone-picker" id="tone-wrapper">
            <label for="tone-select">لحن:</label>
            <select id="tone-select">
              <option value="general">عمومی</option>
              <option value="formal">رسمی</option>
              <option value="informal">صمیمانه</option>
              <option value="technical">تخصصی</option>
            </select>
          </div>
          <span id="char-count" class="char-count">0</span>
        </div>
      </div>

      <button id="translate-submit-btn" class="primary-btn">
        <span class="btn-label">✦ اجرا</span>
        <span class="btn-hint">Ctrl + Enter</span>
      </button>

      <div class="card output-card">
        <div class="card-header output-header">
          <span class="output-title" id="output-title">نتیجه</span>
          <span id="cache-badge" class="cache-badge" title="این نتیجه از حافطه محلی خوانده شد">⚡ از حافطه</span>
          <div class="output-actions">
            <button id="stop-btn" class="icon-btn stop-btn" title="توقف">■</button>
            <button id="tts-result-btn" class="icon-btn" title="پخش صوتی">🔊</button>
            <button id="copy-result-btn" class="icon-btn" title="کپی">📋</button>
          </div>
        </div>
        <div id="output-text" class="output-content placeholder-text">نتیجه زنده اینجا استریم می‌شود...</div>
      </div>
    </main>

    <!-- ==================== History view ==================== -->
    <section id="history-view" class="view-content" style="display: none;">
      <div class="history-header">
        <span>📜 تاریخچه</span>
        <button id="clear-history-btn" class="danger-btn">پاک کردن همه</button>
      </div>

      <div class="history-filters">
        <input id="history-search" type="search" placeholder="🔍 جست‌وجو در متن و نتیجه..." />
        <select id="history-mode-filter">
          <option value="">همه عملکردها</option>
        </select>
      </div>

      <div id="history-list" class="history-list"></div>
      <div class="history-footer" id="history-count"></div>
    </section>

    <footer class="app-footer">
      <span id="active-model-badge" class="model-badge">…</span>
      <span id="status-msg" class="status-msg"></span>
    </footer>
  </div>

  <!-- The shared core must load before the popup logic. -->
  <script src="../shared/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
