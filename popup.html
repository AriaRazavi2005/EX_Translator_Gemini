<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترجمه‌گر هوشمند Gemini</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="sparkle">✦</span>
        <h1>مترجم Gemini AI</h1>
      </div>
      <div class="header-actions">
        <button id="tab-translate-btn" class="nav-tab active" title="ترجمه">ترجمه</button>
        <button id="tab-history-btn" class="nav-tab" title="تاریخچه">تاریخچه</button>
        <button id="open-options-btn" class="icon-btn" title="تنظیمات">⚙️</button>
      </div>
    </header>

    <!-- Main Translate Tab View -->
    <main id="translate-view" class="view-content active">
      <!-- Input Section -->
      <div class="card input-card">
        <div class="card-header">
          <select id="source-lang" class="lang-select">
            <option value="auto">تشخیص خودکار</option>
            <option value="en">انگلیسی</option>
            <option value="fa">فارسی</option>
            <option value="ar">عربی</option>
            <option value="fr">فرانسوی</option>
            <option value="de">آلمانی</option>
            <option value="es">اسپانیایی</option>
          </select>
          <button id="swap-langs-btn" class="icon-btn swap-btn" title="تعویض زبان‌ها">⇄</button>
          <select id="target-lang" class="lang-select">
            <option value="fa">فارسی</option>
            <option value="en">انگلیسی</option>
            <option value="ar">عربی</option>
            <option value="fr">فرانسوی</option>
            <option value="de">آلمانی</option>
            <option value="es">اسپانیایی</option>
          </select>
        </div>

        <div class="textarea-wrapper">
          <textarea id="source-text" placeholder="متن مورد نظر برای ترجمه را اینجا بنویسید یا پیست کنید..."></textarea>
          <button id="clear-text-btn" class="clear-btn" title="پاک کردن">&times;</button>
        </div>

        <div class="card-footer">
          <div class="tone-picker">
            <label>لحن:</label>
            <select id="tone-select">
              <option value="general">عمومی (روان)</option>
              <option value="formal">رسمی و اداری</option>
              <option value="informal">صمیمانه</option>
              <option value="technical">تخصصی و علمی</option>
            </select>
          </div>
          <div class="char-count" id="char-count">0 کاراکتر</div>
        </div>
      </div>

      <!-- Action Button -->
      <button id="translate-submit-btn" class="primary-btn">
        <span class="btn-icon">✦</span>
        <span>شروع ترجمه هوشمند</span>
      </button>

      <!-- Output Section -->
      <div class="card output-card">
        <div class="card-header">
          <span class="output-title">نتیجه ترجمه:</span>
          <div class="output-actions">
            <button id="copy-result-btn" class="icon-btn" title="کپی متن">📋</button>
            <button id="tts-result-btn" class="icon-btn" title="پخش صوتی">🔊</button>
          </div>
        </div>
        <div class="output-content" id="output-text">
          <div class="placeholder-text">ترجمه در این قسمت به صورت زنده استریم می‌شود...</div>
        </div>
      </div>
    </main>

    <!-- History Tab View -->
    <main id="history-view" class="view-content">
      <div class="history-header">
        <span>تاریخچه ترجمه‌ها</span>
        <button id="clear-history-btn" class="danger-btn">پاک‌سازی همه</button>
      </div>
      <div id="history-list" class="history-list">
        <!-- History items will be dynamically inserted here -->
      </div>
    </main>

    <!-- Footer status -->
    <footer class="app-footer">
      <div class="model-badge" id="active-model-badge">مدل: Gemini 2.5 Flash</div>
      <div class="status-msg" id="status-msg">آماده</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
